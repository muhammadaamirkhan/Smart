<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · SmartAttend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#13131a;--card:#1a1a25;--border:#2a2a3d;
  --primary:#7c5cbf;--glow:#9b6dff;--accent:#f0c040;--text:#e8e8f0;--muted:#6b6b8a;
  --green:#3dd68c;--red:#f05070;--blue:#4a8fff;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(42,42,61,0.4) 1px,transparent 1px),
    linear-gradient(90deg,rgba(42,42,61,0.4) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none;z-index:0;}
.auth-card{position:relative;z-index:1;width:100%;max-width:420px;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:36px 32px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px;justify-content:center}
.brand-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--primary),var(--blue));
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.brand-name{font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem}
.brand-name span{color:var(--glow)}
h2{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:6px;text-align:center}
.sub{color:var(--muted);font-size:0.9rem;text-align:center;margin-bottom:24px}
label{display:block;font-size:0.78rem;font-weight:500;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.8px;margin-bottom:7px}
input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;color:var(--text);font-size:0.92rem;font-family:'DM Sans',sans-serif;
  outline:none;transition:border-color 0.2s;margin-bottom:14px}
input:focus{border-color:var(--primary)}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:0.92rem;
  font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--glow));color:#fff;
  transition:transform 0.2s,opacity 0.2s;margin-top:6px}
.btn:hover{opacity:0.92;transform:translateY(-1px)}
.alt{margin-top:18px;text-align:center;color:var(--muted);font-size:0.86rem}
.alt a{color:var(--glow);text-decoration:none;font-weight:600}
.alt a:hover{text-decoration:underline}
.err{background:rgba(240,80,112,0.08);border:1px solid rgba(240,80,112,0.4);
  color:var(--red);padding:10px 14px;border-radius:10px;font-size:0.86rem;
  margin-bottom:14px;text-align:center}
</style></head><body>
<div class="auth-card">
  <div class="brand">
    <div class="brand-icon">🎓</div>
    <div class="brand-name"><span>Smart Class Monitoring</span></div>
  </div>
  <h2>Welcome back</h2>
  <div class="sub">Sign in to continue to your attendance system.</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" autocomplete="username" required
      value="{{ username or '' }}">
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign In</button>
  </form>
  <div class="alt">No account yet? <a href="/signup">Create one</a></div>
</div>
</body></html>
